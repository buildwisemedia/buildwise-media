manifest_version: "1"
purpose: "Approved assets for paid-search HVAC landing page"
approved_assets:
  - path: "public/brand/mark.svg"
    role: "brand mark"
  - path: "public/brand/mark-on-canvas.svg"
    role: "brand mark on near-black canvas"
  - path: "public/fonts/inter-variable-v1.woff2"
    role: "display and body type"
  - path: "public/fonts/jetbrains-mono-variable-v1.woff2"
    role: "labels and proof microcopy"
  - path: "src/data/canonical.json"
    role: "eight-layer system names and truth"
asset_policy:
  reuse_existing_only: true
  commissioned_hvac_photography_pending: true
  interim_visual: "code-rendered eight-layer operating-system diagram"
  no_stock_or_fabricated_hvac_proof: true
  no_gradients_glass_or_glow: true

