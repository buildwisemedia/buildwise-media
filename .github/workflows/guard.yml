name: guard

# Always-on repo hygiene gate. Fails the build if node_modules — or any stray
# symlink that resolves into it — ever becomes tracked in git.
#
# Origin: 2026-06-04 an automated build committed a self-referential
# `node_modules` symlink (mode 120000 → its own absolute path), which broke
# every local `astro build` with "Too many levels of symbolic links". The bare
# symlink slipped past `.gitignore`'s `node_modules/` (trailing slash matches
# directory contents, not the symlink). Fixed in efbcc0b; this gate stops a
# recurrence. Local pre-commit hooks aren't shared across machines/executors (the
# offending build ran without one), so CI is the real enforcement surface.
#
# Logic lives in scripts/guard-no-vendored-modules.mjs (also runnable locally via
# `npm run qa:guard`).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bob-consent-build:
    name: Bob consent build and privacy boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify private invitation and tracking-free artifact
        shell: bash
        run: |
          set -euo pipefail
          page=dist/sms-consent/index.html
          grep -Fq 'This page needs your personal invitation link' "$page"
          grep -Eq '<form[^>]+id="sms-consent-form"[^>]+hidden' "$page"
          grep -Fq 'form.hidden = true' "$page"
          grep -Fq 'form.hidden = false' "$page"
          grep -Eq '\.consent-form[^,{]*\[hidden\]' "$page"
          grep -Eq '\.consent-form[^,{]* section[^,{]*\[hidden\]' "$page"
          grep -Eq '\.consent-form[^,{]*\[hidden\][^{]*\{[^}]*display:[[:space:]]*none' "$page"
          grep -Eq '\.consent-form[^,{]* section[^,{]*\[hidden\][^{]*\{[^}]*display:[[:space:]]*none' "$page"
          grep -Fq '/pilot/onboarding/start' "$page"
          grep -Fq '/pilot/onboarding/verify' "$page"
          grep -Fq 'FEEDBACK:' "$page"
          grep -Fq 'data-consent-version="bob-client-support-v2.0"' "$page"
          grep -Fq 'data-consent-sha256="10d23e1f6a0cbcdf3ae736ea5c914b6c3345c685482af65dd40ee5c5546d7de8"' "$page"
          if grep -Eq 'googletagmanager.com/(gtag|gtm|ns.html)|clarity.ms|connect.facebook.net|facebook.com/tr|book.buildwisemedia.com|bwm-form-handler|resend' "$page"; then
            echo 'Private consent artifact contains a forbidden tracking or lead-form endpoint.' >&2
            exit 1
          fi

  no-vendored-modules:
    name: No vendored node_modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard against tracked node_modules
        run: node scripts/guard-no-vendored-modules.mjs
